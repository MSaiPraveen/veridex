apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: veridex
  labels:
    app: notification-service
spec:
  ports:
    - port: 3007
      targetPort: 3007
      protocol: TCP
  selector:
    app: notification-service
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: veridex
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: veridex/notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3007
          envFrom:
            - secretRef:
                name: veridex-secrets
            - configMapRef:
                name: veridex-config
          env:
            - name: PORT
              value: "3007"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: veridex-secrets
                  key: MONGO_NOTIFICATIONS_URI
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 5
            periodSeconds: 5
