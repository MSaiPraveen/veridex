apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: veridex
  labels:
    app: document-service
spec:
  ports:
    - port: 3005
      targetPort: 3005
      protocol: TCP
  selector:
    app: document-service
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: veridex
  labels:
    app: document-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
        - name: document-service
          image: veridex/document-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3005
          envFrom:
            - secretRef:
                name: veridex-secrets
            - configMapRef:
                name: veridex-config
          env:
            - name: PORT
              value: "3005"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: veridex-secrets
                  key: MONGO_DOCUMENTS_URI
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Startup probe - allows time for app initialization
          startupProbe:
            httpGet:
              path: /health/live
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30  # 5s * 30 = 150s max startup time
          # Liveness probe - restart if process is unhealthy
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3005
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe - only route traffic when dependencies ready
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3005
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
---
# PodDisruptionBudget - ensure availability during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: document-service-pdb
  namespace: veridex
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: document-service
