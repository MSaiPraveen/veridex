apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: veridex
  labels:
    app: auth-service
spec:
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
  selector:
    app: auth-service
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: veridex
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # Security: Run as non-root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: auth-service
          image: veridex/auth-service:v1.0.0
          imagePullPolicy: Always
          # Container security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: veridex-secrets
            - configMapRef:
                name: veridex-config
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: veridex-secrets
                  key: MONGO_AUTH_URI
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          # Startup probe - allows time for initial connection to DB
          startupProbe:
            httpGet:
              path: /health/live
              port: 3001
            failureThreshold: 30
            periodSeconds: 2
          # Liveness probe - restart container if process is stuck
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe - only route traffic when DB is connected
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      # Volumes for read-only filesystem
      volumes:
        - name: tmp
          emptyDir: {}
---
# Pod Disruption Budget - ensure availability during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: veridex
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
