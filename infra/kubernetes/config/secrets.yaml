# Veridex Kubernetes Secrets Template
# ==============================================================================
# WARNING: This is a TEMPLATE file with placeholder values only.
# 
# For production deployment:
# 1. Use sealed-secrets, external-secrets, or HashiCorp Vault
# 2. NEVER commit real secrets to version control
# 3. Replace all <placeholder> values before applying
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: veridex-secrets
  namespace: veridex
type: Opaque
stringData:
  # JWT Configuration
  # Generate with: openssl rand -hex 32
  JWT_SECRET: "<generate-jwt-secret-here>"
  JWT_REFRESH_SECRET: "<generate-refresh-secret-here>"

  # MongoDB Atlas URIs (one per service)
  # Format: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/<database>
  MONGO_AUTH_URI: "<mongodb-connection-string-for-auth>"
  MONGO_USER_ORG_URI: "<mongodb-connection-string-for-user-org>"
  MONGO_PRODUCTS_URI: "<mongodb-connection-string-for-products>"
  MONGO_DOCUMENTS_URI: "<mongodb-connection-string-for-documents>"
  MONGO_COMPLIANCE_URI: "<mongodb-connection-string-for-compliance>"
  MONGO_NOTIFICATIONS_URI: "<mongodb-connection-string-for-notifications>"
  MONGO_AUDIT_URI: "<mongodb-connection-string-for-audit>"

  # Kafka
  KAFKA_BROKER: "kafka:9092"

  # Email (for notifications)
  SMTP_HOST: "<your-smtp-host>"
  SMTP_USER: "<your-smtp-user>"
  SMTP_PASSWORD: "<your-smtp-password>"

  # Redis (for rate limiting / caching)
  REDIS_URL: "redis://redis:6379"

  # Internal service key
  INTERNAL_SERVICE_KEY: "<generate-internal-service-key>"
