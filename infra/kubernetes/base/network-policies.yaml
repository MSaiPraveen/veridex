---
# MongoDB - only accepts traffic from backend services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-policy
  namespace: veridex
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - auth-service
                  - user-org-service
                  - product-service
                  - document-service
                  - compliance-service
                  - notification-service
                  - audit-log-service
      ports:
        - protocol: TCP
          port: 27017

