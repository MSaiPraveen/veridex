# ==============================================================================
# VERIDEX - Docker Compose Configuration
# ==============================================================================
# IMPORTANT: Copy .env.example to .env and configure before running
# ==============================================================================

services:
  # ============================================================================
  # INFRASTRUCTURE
  # ============================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: veridex-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: veridex-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veridex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # BACKEND SERVICES
  # ============================================================================

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: veridex-auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=${MONGO_URI_AUTH}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-7d}
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  user-org-service:
    build:
      context: .
      dockerfile: apps/user-org-service/Dockerfile
    container_name: veridex-user-org-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGO_URI=${MONGO_URI_USERS}
      - KAFKA_BROKER=kafka:9092
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: veridex-product-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - MONGO_URI=${MONGO_URI_PRODUCTS}
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  document-service:
    build:
      context: .
      dockerfile: apps/document-service/Dockerfile
    container_name: veridex-document-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - MONGO_URI=${MONGO_URI_DOCUMENTS}
      - KAFKA_BROKER=kafka:9092
      - UPLOAD_DIR=/app/uploads
    volumes:
      - document_uploads:/app/uploads
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  compliance-service:
    build:
      context: .
      dockerfile: apps/compliance-service/Dockerfile
    container_name: veridex-compliance-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - MONGO_URI=${MONGO_URI_COMPLIANCE}
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: veridex-notification-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - MONGO_URI=${MONGO_URI_NOTIFICATIONS}
      - KAFKA_BROKER=kafka:9092
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  audit-log-service:
    build:
      context: .
      dockerfile: apps/audit-log-service/Dockerfile
    container_name: veridex-audit-log-service
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - MONGO_URI=${MONGO_URI_AUDIT}
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: veridex-api-gateway
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_SECRET=${JWT_ACCESS_SECRET}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - DOCKER_ENV=true
      # Service URLs (Docker internal networking)
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-org-service:3003
      - PRODUCT_SERVICE_URL=http://product-service:3004
      - DOCUMENT_SERVICE_URL=http://document-service:3005
      - COMPLIANCE_SERVICE_URL=http://compliance-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:3007
      - AUDIT_SERVICE_URL=http://audit-log-service:3008
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-org-service:
        condition: service_started
      product-service:
        condition: service_started
      document-service:
        condition: service_started
      compliance-service:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  document_uploads:
